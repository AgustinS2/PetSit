<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>PetSit – Solicitud enviada</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" th:href="@{/css/core.css}">
</head>
<body class="petsit-bg">
<main class="container py-5 text-center" style="max-width:480px;">
  <div style="width:72px;height:72px;background:#d1fae5;border-radius:20px;display:flex;align-items:center;justify-content:center;margin:0 auto 1.5rem;">
    <i class="bi bi-check-circle-fill text-success fs-2"></i>
  </div>
  <h1 class="h3 mb-2">¡Solicitud enviada!</h1>
  <p class="text-muted mb-4">
    Recibimos tu solicitud. El equipo de PetSit la revisará y una vez aprobada,
    tu veterinaria o refugio aparecerá en el mapa y en el listado.
  </p>
  <a th:href="@{/petsit/index}" class="btn btn-primary px-4">
    <i class="bi bi-house me-2"></i> Volver al inicio
  </a>
</main>
</body>
</html>
