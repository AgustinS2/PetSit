<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>PetSit – Postularme para adoptar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" th:href="@{/css/core.css}">
  <link rel="icon" th:href="@{/assets/favicon/favicon.ico}" sizes="any">
</head>
<body class="petsit-bg">

<div class="container py-5" style="max-width:580px;">
  <div class="mb-4 d-flex align-items-center gap-3">
    <a th:href="@{/petsit/adopciones/list}" class="btn btn-outline-secondary btn-sm">
      <i class="bi bi-arrow-left"></i> Volver a adopciones
    </a>
    <h1 class="h4 mb-0">Postularme para adoptar</h1>
  </div>

  <form th:action="@{/petsit/postulaciones/save}" th:object="${postulacion}" method="post" class="card p-4 shadow-sm">

    <!-- Select de adopción (puede venir preseleccionado por parámetro de URL) -->
    <div class="mb-3">
      <label for="adopcionSelect" class="form-label">Adopción <span class="text-danger">*</span></label>
      <select id="adopcionSelect" name="adopcion.id" class="form-select" required>
        <option value="">— Seleccioná la adopción —</option>
        <option th:each="a : ${listAdopciones}"
                th:value="${a.id}"
                th:text="${a.mascota.nombre + ' – ' + a.mascota.raza}"
                th:selected="${param.adopcionId != null and #strings.toString(a.id) == param.adopcionId[0]}">
        </option>
      </select>
    </div>

    <div class="mb-4">
      <label for="mensaje" class="form-label">Mensaje para el dueño</label>
      <textarea id="mensaje" class="form-control" th:field="*{mensaje}" rows="5"
                placeholder="Contale quién sos, por qué querés adoptar, si tenés espacio, otras mascotas, etc."></textarea>
      <div class="form-text">Un mensaje personalizado mejora mucho tus posibilidades.</div>
    </div>

    <div class="d-flex gap-2 justify-content-end">
      <a th:href="@{/petsit/adopciones/list}" class="btn btn-outline-secondary">Cancelar</a>
      <button type="submit" class="btn btn-brand">
        <i class="bi bi-send me-1"></i> Enviar postulación
      </button>
    </div>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
