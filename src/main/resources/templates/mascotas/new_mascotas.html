<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PetSit – Registrar mascota</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" th:href="@{/css/core.css}">
</head>
<body class="petsit-bg">

<div class="container py-5" style="max-width:600px;">

  <div class="mb-4 d-flex align-items-center gap-3">
    <a th:href="@{/petsit/mascotas/mis_mascotas}" class="btn btn-outline-secondary btn-sm">
      <i class="bi bi-arrow-left"></i> Volver
    </a>
    <h1 class="h4 mb-0">Registrar nueva mascota</h1>
  </div>

  <!--
    IMPORTANTE: el name del campo del dueño es "dueno.id".
    Spring va a enviarlo como parámetro de request; el controller
    lo recibe con @RequestParam("dueno.id") y resuelve el objeto Usuario.
    NO uses th:field="*{dueno}" directamente porque Spring no puede
    convertir un String (el ID del select) a un objeto Usuario sin un Converter.
  -->
  <form th:action="@{/petsit/mascotas/save}" th:object="${mascota}" method="post" class="card p-4 shadow-sm">

    <div class="mb-3">
      <label for="nombre" class="form-label">Nombre <span class="text-danger">*</span></label>
      <input id="nombre" type="text" class="form-control" th:field="*{nombre}" required placeholder="Ej: Luna">
    </div>

    <div class="row g-3 mb-3">
      <div class="col-md-6">
        <label for="raza" class="form-label">Raza</label>
        <input id="raza" type="text" class="form-control" th:field="*{raza}" placeholder="Ej: Labrador">
      </div>
      <div class="col-md-6">
        <label for="color" class="form-label">Color</label>
        <input id="color" type="text" class="form-control" th:field="*{color}" placeholder="Ej: Negro">
      </div>
    </div>

    <div class="row g-3 mb-3">
      <div class="col-md-4">
        <label for="tamano" class="form-label">Tamaño</label>
        <select id="tamano" class="form-select" th:field="*{tamano}">
          <option value="">Seleccionar</option>
          <option value="chico">Chico</option>
          <option value="mediano">Mediano</option>
          <option value="grande">Grande</option>
        </select>
      </div>
      <div class="col-md-4">
        <label for="edad" class="form-label">Edad (años)</label>
        <input id="edad" type="number" class="form-control" th:field="*{edad}" min="0" placeholder="0">
      </div>
      <div class="col-md-4">
        <label for="sexo" class="form-label">Sexo</label>
        <select id="sexo" class="form-select" th:field="*{sexo}">
          <option value="">Seleccionar</option>
          <option value="Macho">Macho</option>
          <option value="Hembra">Hembra</option>
        </select>
      </div>
    </div>

    <div class="mb-3">
      <label for="descripcion" class="form-label">Descripción / señas particulares</label>
      <textarea id="descripcion" class="form-control" th:field="*{descripcion}" rows="3"
                placeholder="Collar, manchas, comportamiento, etc."></textarea>
    </div>

    <div class="mb-3">
      <label for="foto" class="form-label">Foto (URL)</label>
      <input id="foto" type="text" class="form-control" th:field="*{foto}" placeholder="https://...">
    </div>

    <!--
      SELECT DEL DUEÑO
      ─────────────────────────────────────────────────
      name="dueno.id"  →  Spring lo recibe como @RequestParam
      th:value="${u.id}"  →  el valor que se envía al POST
      th:text             →  lo que se muestra en la lista
      th:selected         →  preselecciona si ya hay un dueño asignado

      La lista "usuarios" la carga el controller en el Model.
      Si la vista la usa solo el admin, mostrá este bloque.
      Si el usuario registra su propia mascota y no necesita elegir dueño,
      podés ocultar este campo; el controller asignará al principal.
    -->
    <div class="mb-4">
      <label for="duenoSelect" class="form-label">Dueño</label>
      <select id="duenoSelect" name="dueno.id" class="form-select">
        <option value="">— Seleccionar dueño —</option>
        <option th:each="u : ${usuarios}"
                th:value="${u.id}"
                th:text="${u.nombre + ' ' + u.apellido}"
                th:selected="${mascota.dueno != null and mascota.dueno.id == u.id}">
        </option>
      </select>
      <div class="form-text">Si lo dejás vacío, la mascota queda registrada a tu nombre.</div>
    </div>

    <div class="d-flex gap-2 justify-content-end">
      <a th:href="@{/petsit/mascotas/mis_mascotas}" class="btn btn-outline-secondary">Cancelar</a>
      <button type="submit" class="btn btn-brand">
        <i class="bi bi-check2-circle me-1"></i> Guardar
      </button>
    </div>

  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
