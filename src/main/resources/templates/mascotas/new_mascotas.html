<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>PetSit – Registrar mascota</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Caudex:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" th:href="@{/css/core.css}">
  <link rel="stylesheet" th:href="@{/css/nav-user.css}">
  <link rel="stylesheet" th:href="@{/css/user.css}">
  <link rel="icon" th:href="@{/assets/favicon/favicon.ico}" sizes="any">
</head>
<body class="petsit-bg page-user-menu">

<nav class="navbar navbar-expand-lg navbar-light bg-nav border-bottom petsit-nav-user">
  <div class="container-fluid px-3 px-md-4">
    <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/petsit/usuarios/index}">
      <img th:src="@{/assets/img/icons/logo.png}" alt="Logo PetSit" height="56">
      <img th:src="@{/assets/img/Petsit.png}" alt="PetSit" class="brand-name">
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav mx-auto nav-center gap-lg-3">
        <li class="nav-item"><a class="nav-link active" th:href="@{/petsit/mascotas/mis_mascotas}">Mis mascotas</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/petsit/usuarios/usuarioveterinarias}">Veterinarias</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/petsit/usuarios/usuariorefugio}">Refugios</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/petsit/usuarios/usuarioadoptar}">Adoptar</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/petsit/usuarios/mis-solicitudes}">Solicitudes</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/petsit/usuarios/usuariomapa}">Mapa</a></li>
      </ul>
      <ul class="navbar-nav ms-auto align-items-center d-none d-lg-flex nav-login">
        <li class="nav-item dropdown">
          <a class="nav-link user-chip dropdown-toggle d-flex align-items-center gap-2" href="#" role="button" data-bs-toggle="dropdown">
            <span class="user-avatar"><img th:src="@{/assets/img/icons/usuario.png}" alt="Avatar"></span>
            <span th:text="${usuarioLogueado != null ? usuarioLogueado.nombre : 'Usuario'}">Usuario</span>
          </a>
          <ul class="dropdown-menu dropdown-menu-end user-menu">
            <li><a class="dropdown-item" th:href="@{/petsit/usuarios/perfil}"><i class="bi bi-person-gear me-2"></i>Mi perfil</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item text-danger" th:href="@{/logout}"><i class="bi bi-box-arrow-right me-2"></i>Cerrar sesión</a></li>
          </ul>
        </li>
      </ul>
    </div>
  </div>
</nav>

<main class="container py-5" style="max-width:640px;">
  <div class="d-flex align-items-center gap-3 mb-4">
    <a th:href="@{/petsit/mascotas/mis_mascotas}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Volver</a>
    <div>
      <h1 class="h3 mb-0">Registrar nueva mascota</h1>
      <p class="text-muted small mb-0" th:if="${usuarioLogueado != null}"
         th:text="'Se registrará a nombre de ' + ${usuarioLogueado.nombre} + ' ' + ${usuarioLogueado.apellido}"></p>
    </div>
  </div>

  <form th:action="@{/petsit/mascotas/save}" th:object="${mascota}" method="post" enctype="multipart/form-data">
    <div class="card shadow-sm p-4 mb-4">
      <h5 class="mb-3">Datos de la mascota</h5>
      <div class="row g-3">
        <div class="col-12">
          <label class="form-label fw-semibold">Foto</label>
          <input type="file" class="form-control" name="fotoFile" accept="image/*" id="fotoInput">
          <div id="fotoPreview" style="display:none;margin-top:.5rem;border-radius:10px;overflow:hidden;max-height:180px;">
            <img id="fotoPreviewImg" style="width:100%;height:180px;object-fit:cover;" alt="Preview">
          </div>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">Nombre *</label>
          <input type="text" class="form-control" th:field="*{nombre}" required placeholder="Ej: Luna">
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">Sexo</label>
          <select class="form-select" th:field="*{sexo}">
            <option value="">Seleccionar</option>
            <option value="Macho">Macho</option>
            <option value="Hembra">Hembra</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">Raza</label>
          <input type="text" class="form-control" th:field="*{raza}" placeholder="Ej: Labrador">
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">Color</label>
          <input type="text" class="form-control" th:field="*{color}" placeholder="Ej: Negro">
        </div>
        <div class="col-md-4">
          <label class="form-label fw-semibold">Tamaño</label>
          <select class="form-select" th:field="*{tamano}">
            <option value="">Seleccionar</option>
            <option value="chico">Chico</option>
            <option value="mediano">Mediano</option>
            <option value="grande">Grande</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label fw-semibold">Edad (años)</label>
          <input type="number" class="form-control" th:field="*{edad}" min="0" placeholder="0">
        </div>
        <div class="col-md-4">
          <label class="form-label fw-semibold">Fecha nacimiento</label>
          <input type="date" class="form-control" th:field="*{fechaNacimiento}">
        </div>
        <div class="col-12">
          <label class="form-label fw-semibold">Descripcion / senas</label>
          <textarea class="form-control" th:field="*{descripcion}" rows="3" placeholder="Collar, manchas, comportamiento, etc."></textarea>
        </div>
      </div>
    </div>
    <div class="d-flex gap-2 justify-content-end">
      <a th:href="@{/petsit/mascotas/mis_mascotas}" class="btn btn-outline-secondary">Cancelar</a>
      <button type="submit" class="btn btn-primary fw-bold px-4">
        <i class="bi bi-check2-circle me-2"></i> Guardar mascota
      </button>
    </div>
  </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  document.getElementById('fotoInput').addEventListener('change', function(e) {
    const file = e.target.files?.[0];
    if (!file) { document.getElementById('fotoPreview').style.display = 'none'; return; }
    document.getElementById('fotoPreviewImg').src = URL.createObjectURL(file);
    document.getElementById('fotoPreview').style.display = 'block';
  });
</script>
</body>
</html>
