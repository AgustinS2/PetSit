<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>PetSit – Publicar adopción</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" th:href="@{/css/core.css}">
  <link rel="icon" th:href="@{/assets/favicon/favicon.ico}" sizes="any">
</head>
<body class="petsit-bg">

<div class="container py-5" style="max-width:580px;">
  <div class="mb-4 d-flex align-items-center gap-3">
    <a th:href="@{/petsit/adopciones/list}" class="btn btn-outline-secondary btn-sm">
      <i class="bi bi-arrow-left"></i> Volver
    </a>
    <h1 class="h4 mb-0">Publicar adopción</h1>
  </div>

  <form th:action="@{/petsit/adopciones/save}" th:object="${adopcion}" method="post" class="card p-4 shadow-sm">

    <!-- Select de la mascota del usuario -->
    <div class="mb-3">
      <label for="mascotaSelect" class="form-label">Mascota <span class="text-danger">*</span></label>
      <select id="mascotaSelect" name="mascota.id" class="form-select" required>
        <option value="">— Seleccioná una mascota —</option>
        <option th:each="m : ${misMascotas}"
                th:value="${m.id}"
                th:text="${m.nombre + ' (' + m.raza + ')'}">
        </option>
      </select>
      <div class="form-text">Solo aparecen tus mascotas registradas.
        <a th:href="@{/petsit/mascotas/new}">Registrar nueva</a>
      </div>
    </div>

    <div class="mb-3">
      <label for="descripcion" class="form-label">Descripción</label>
      <textarea id="descripcion" class="form-control" th:field="*{descripcion}" rows="4"
                placeholder="Contá por qué está en adopción, su carácter, necesidades especiales..."></textarea>
    </div>

    <div class="mb-4">
      <label for="estado" class="form-label">Estado</label>
      <select id="estado" class="form-select" th:field="*{estado}">
        <option value="ACTIVA">Activa</option>
        <option value="PAUSADA">Pausada</option>
        <option value="CERRADA">Cerrada</option>
      </select>
    </div>

    <div class="d-flex gap-2 justify-content-end">
      <a th:href="@{/petsit/adopciones/list}" class="btn btn-outline-secondary">Cancelar</a>
      <button type="submit" class="btn btn-brand">
        <i class="bi bi-check2-circle me-1"></i> Publicar
      </button>
    </div>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
