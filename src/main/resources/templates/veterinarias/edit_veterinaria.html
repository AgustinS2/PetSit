<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>PetSit – Editar veterinaria</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/core.css}">
  <link rel="icon" th:href="@{/assets/favicon/favicon.ico}" sizes="any">
</head>
<body class="petsit-bg">
<div class="container py-5" style="max-width:560px;">
  <div class="mb-4 d-flex align-items-center gap-3">
    <a th:href="@{/petsit/veterinarias/list}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Volver</a>
    <h1 class="h4 mb-0">Editar veterinaria</h1>
  </div>
  <form th:action="@{/petsit/veterinarias/save}" th:object="${veterinaria}" method="post" class="card p-4 shadow-sm">
    <input type="hidden" th:field="*{id}"/>
    <div class="mb-3">
      <label class="form-label">Nombre <span class="text-danger">*</span></label>
      <input type="text" class="form-control" th:field="*{nombre}" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Dirección</label>
      <input type="text" class="form-control" th:field="*{direccion}">
    </div>
    <div class="row g-3 mb-3">
      <div class="col-md-6">
        <label class="form-label">Teléfono</label>
        <input type="text" class="form-control" th:field="*{telefono}">
      </div>
      <div class="col-md-6">
        <label class="form-label">Horario de atención</label>
        <input type="text" class="form-control" th:field="*{horarioAtencion}">
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label">Ubicación</label>
      <input type="text" class="form-control" th:field="*{ubicacion}">
    </div>
    <div class="mb-4 form-check">
      <input type="checkbox" class="form-check-input" th:field="*{activa}" id="activa">
      <label class="form-check-label" for="activa">Activa</label>
    </div>
    <div class="d-flex gap-2 justify-content-end">
      <a th:href="@{/petsit/veterinarias/list}" class="btn btn-outline-secondary">Cancelar</a>
      <button type="submit" class="btn btn-brand"><i class="bi bi-check2-circle me-1"></i> Actualizar</button>
    </div>
  </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
