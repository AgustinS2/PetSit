<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>PetSit Admin – Editar usuario</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" th:href="@{/css/core.css}">
  <link rel="icon" th:href="@{/assets/favicon/favicon.ico}" sizes="any">
  <style>body{background:#f5f7f5;}</style>
</head>
<body class="petsit-bg">
<div class="container py-5" style="max-width:540px;">
  <div class="mb-4 d-flex align-items-center gap-3">
    <a th:href="@{/petsit/admin/index}" class="btn btn-outline-secondary btn-sm">
      <i class="bi bi-arrow-left"></i> Volver al panel
    </a>
    <h1 class="h4 mb-0">Editar usuario</h1>
  </div>

  <form th:action="@{/petsit/admin/usuarios/save}" th:object="${usuarioEdit}" method="post" class="card p-4 shadow-sm">
    <input type="hidden" th:field="*{id}"/>
    <input type="hidden" th:field="*{contrasena}"/>

    <div class="mb-3">
      <label class="form-label fw-semibold">Nombre</label>
      <input type="text" class="form-control" th:field="*{nombre}" required>
    </div>
    <div class="mb-3">
      <label class="form-label fw-semibold">Apellido</label>
      <input type="text" class="form-control" th:field="*{apellido}" required>
    </div>
    <div class="mb-3">
      <label class="form-label fw-semibold">Correo</label>
      <input type="email" class="form-control" th:field="*{correo}" required>
    </div>
    <div class="mb-3">
      <label class="form-label fw-semibold">Teléfono</label>
      <input type="text" class="form-control" th:field="*{telefono}">
    </div>

    <!-- Tipo de usuario — campo clave para dar permisos -->
    <div class="mb-4">
      <label class="form-label fw-semibold">Tipo de usuario <span class="text-danger">*</span></label>
      <select class="form-select" th:field="*{tipo}" required>
        <option th:each="t : ${tipoUsuarios}"
                th:value="${t}"
                th:text="${t.descripcion}"
                th:selected="${usuarioEdit.tipo == t}">
        </option>
      </select>
      <div class="form-text">
        <strong>ADMINISTRADOR</strong> tiene acceso al panel admin.
        <strong>DUENO</strong> es un usuario estándar.
        <strong>VETERINARIO / REFUGIO</strong> son cuentas institucionales.
      </div>
    </div>

    <div class="d-flex gap-2 justify-content-end">
      <a th:href="@{/petsit/admin/index}" class="btn btn-outline-secondary">Cancelar</a>
      <button type="submit" class="btn btn-success">
        <i class="bi bi-check2-circle me-1"></i> Guardar cambios
      </button>
    </div>
  </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
