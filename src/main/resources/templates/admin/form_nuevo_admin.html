<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>PetSit Admin – Nuevo administrador</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" th:href="@{/css/core.css}">
  <link rel="icon" th:href="@{/assets/favicon/favicon.ico}" sizes="any">
  <style>body{background:#f5f7f5;}</style>
</head>
<body class="petsit-bg">
<div class="container py-5" style="max-width:520px;">

  <div class="mb-4 d-flex align-items-center gap-3">
    <a th:href="@{/petsit/admin/index}" class="btn btn-outline-secondary btn-sm">
      <i class="bi bi-arrow-left"></i> Volver al panel
    </a>
    <h1 class="h4 mb-0">Dar de alta un administrador</h1>
  </div>

  <div class="alert alert-warning d-flex gap-2 align-items-start mb-4">
    <i class="bi bi-shield-exclamation fs-5 flex-shrink-0 mt-1"></i>
    <div>
      Esta acción crea una cuenta con <strong>acceso completo al panel de administración</strong>.
      Solo usá esta opción para usuarios de confianza del equipo PetSit.
    </div>
  </div>

  <form th:action="@{/petsit/admin/usuarios/nuevo-admin/save}"
        th:object="${nuevoAdmin}" method="post" class="card p-4 shadow-sm">

    <div class="row g-3 mb-3">
      <div class="col-md-6">
        <label class="form-label fw-semibold">Nombre <span class="text-danger">*</span></label>
        <input type="text" class="form-control" th:field="*{nombre}" required>
      </div>
      <div class="col-md-6">
        <label class="form-label fw-semibold">Apellido <span class="text-danger">*</span></label>
        <input type="text" class="form-control" th:field="*{apellido}" required>
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label fw-semibold">Email <span class="text-danger">*</span></label>
      <input type="email" class="form-control" th:field="*{correo}" required
             placeholder="correo@petsit.com">
    </div>

    <div class="mb-3">
      <label class="form-label fw-semibold">Teléfono</label>
      <input type="tel" class="form-control" th:field="*{telefono}">
    </div>

    <div class="mb-4">
      <label class="form-label fw-semibold">Contraseña <span class="text-danger">*</span></label>
      <div class="input-group">
        <input type="password" class="form-control" th:field="*{contrasena}"
               id="passAdmin" required placeholder="Mínimo 8 caracteres">
        <button class="btn btn-outline-secondary" type="button"
                onclick="const i=document.getElementById('passAdmin');i.type=i.type==='password'?'text':'password'">
          <i class="bi bi-eye"></i>
        </button>
      </div>
      <div class="form-text">El administrador podrá cambiarla después desde su perfil.</div>
    </div>

    <!-- Tipo fijo — no editable, siempre ADMINISTRADOR -->
    <input type="hidden" th:field="*{tipo}" th:value="ADMINISTRADOR"/>

    <div class="d-flex gap-2 justify-content-end">
      <a th:href="@{/petsit/admin/index}" class="btn btn-outline-secondary">Cancelar</a>
      <button type="submit" class="btn btn-danger fw-bold">
        <i class="bi bi-shield-check me-1"></i> Crear administrador
      </button>
    </div>
  </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
