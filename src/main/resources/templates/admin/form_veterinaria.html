<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>PetSit Admin – Veterinaria</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" th:href="@{/css/core.css}">
  <link rel="icon" th:href="@{/assets/favicon/favicon.ico}" sizes="any">
  <style>body{background:#f5f7f5;font-family:'Caudex',serif;}</style>
</head>
<body class="petsit-bg">
<div class="container py-5" style="max-width:600px;">
  <div class="mb-4 d-flex align-items-center gap-3">
    <a th:href="@{/petsit/admin/index}" class="btn btn-outline-secondary btn-sm">
      <i class="bi bi-arrow-left"></i> Volver al panel
    </a>
    <h1 class="h4 mb-0" th:text="${veterinaria.id != null ? 'Editar veterinaria' : 'Nueva veterinaria'}">Veterinaria</h1>
  </div>

  <form th:action="@{/petsit/admin/veterinarias/save}" th:object="${veterinaria}" method="post" class="card p-4 shadow-sm">
    <input type="hidden" th:field="*{id}"/>

    <div class="mb-3">
      <label class="form-label fw-semibold">Nombre <span class="text-danger">*</span></label>
      <input type="text" class="form-control" th:field="*{nombre}" required>
    </div>
    <div class="mb-3">
      <label class="form-label fw-semibold">Dirección</label>
      <input type="text" class="form-control" th:field="*{direccion}">
    </div>
    <div class="row g-3 mb-3">
      <div class="col-md-6">
        <label class="form-label fw-semibold">Teléfono</label>
        <input type="text" class="form-control" th:field="*{telefono}">
      </div>
      <div class="col-md-6">
        <label class="form-label fw-semibold">Ubicación / Barrio</label>
        <input type="text" class="form-control" th:field="*{ubicacion}">
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label fw-semibold">Horario de atención</label>
      <input type="text" class="form-control" th:field="*{horarioAtencion}" placeholder="Ej: Lun-Vie 9-20hs">
    </div>
    <div class="mb-4 form-check form-switch">
      <input class="form-check-input" type="checkbox" th:field="*{activa}" id="activa">
      <label class="form-check-label" for="activa">Veterinaria activa (visible en el listado)</label>
    </div>
    <div class="d-flex gap-2 justify-content-end">
      <a th:href="@{/petsit/admin/index}" class="btn btn-outline-secondary">Cancelar</a>
      <button type="submit" class="btn btn-success">
        <i class="bi bi-check2-circle me-1"></i> Guardar
      </button>
    </div>
  </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
