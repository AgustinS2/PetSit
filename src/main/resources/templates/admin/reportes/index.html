<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>PetSit Admin – Reportes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Caudex:wght@400;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" th:href="@{/css/core.css}">
  <link rel="icon" th:href="@{/assets/favicon/favicon.ico}" sizes="any">
  <style>
    body{background:#f5f7f5;font-family:'Caudex',serif;}
    .admin-sidebar{width:220px;min-height:100vh;background:#1a1a2e;display:flex;flex-direction:column;padding:1.5rem 0;position:fixed;top:0;left:0;}
    .admin-brand{padding:0 1.25rem 1.5rem;border-bottom:1px solid rgba(255,255,255,.1);}
    .admin-nav a{display:flex;align-items:center;gap:.75rem;padding:.6rem 1.25rem;color:rgba(255,255,255,.7);text-decoration:none;font-size:.88rem;transition:all .15s;}
    .admin-nav a:hover,.admin-nav a.active{background:rgba(255,255,255,.08);color:#fff;}
    .admin-nav a i{font-size:1rem;width:20px;}
    .admin-nav .nav-section{padding:.5rem 1.25rem .25rem;font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.35);}
    .admin-main{margin-left:220px;padding:2rem;}
    .pending-badge{background:#ef4444;color:#fff;border-radius:10px;padding:.15rem .55rem;font-size:.72rem;font-weight:700;}
    .tipo-pill{padding:.2rem .6rem;border-radius:20px;font-size:.72rem;font-weight:700;}
    .pet-thumb{width:40px;height:40px;border-radius:8px;object-fit:cover;}
  </style>
</head>
<body>
<aside class="admin-sidebar">
  <div class="admin-brand">
    <img th:src="@{/assets/img/Petsit.png}" alt="PetSit" style="filter:brightness(10);height:36px;">
  </div>
  <nav class="admin-nav">
    <div class="nav-section">Panel</div>
    <a th:href="@{/petsit/admin/index}"><i class="bi bi-house"></i> Dashboard</a>
    <a th:href="@{/petsit/alertas/mapa}"><i class="bi bi-map"></i> Ver mapa</a>
    <div class="nav-section mt-2">Gestión</div>
    <a th:href="@{/petsit/admin/usuarios}"><i class="bi bi-people"></i> Usuarios</a>
    <a th:href="@{/petsit/admin/mascotas}"><i class="bi bi-heart"></i> Mascotas</a>
    <a th:href="@{/petsit/admin/veterinarias}"><i class="bi bi-hospital"></i> Veterinarias
      <span class="pending-badge ms-auto" th:if="${pendientesVet > 0}" th:text="${pendientesVet}">0</span></a>
    <a th:href="@{/petsit/admin/refugios}"><i class="bi bi-house-heart"></i> Refugios
      <span class="pending-badge ms-auto" th:if="${pendientesRef > 0}" th:text="${pendientesRef}">0</span></a>
    <a th:href="@{/petsit/admin/adopciones}"><i class="bi bi-stars"></i> Adopciones</a>
    <a th:href="@{/petsit/admin/reportes}" class="active"><i class="bi bi-exclamation-circle"></i> Reportes</a>
    <div class="nav-section mt-2">Cuenta</div>
    <a th:href="@{/petsit/usuarios/index}"><i class="bi bi-arrow-left"></i> Volver al sitio</a>
    <a th:href="@{/logout}" style="color:#f87171;"><i class="bi bi-box-arrow-right"></i> Cerrar sesión</a>
  </nav>
</aside>

<main class="admin-main">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h1 class="h3 mb-0">Reportes</h1>
      <p class="text-muted small mb-0">Mascotas perdidas, encontradas y avistadas</p>
    </div>
    <a th:href="@{/petsit/alertas/mapa}" class="btn btn-sm btn-outline-primary">
      <i class="bi bi-map me-1"></i> Ver en mapa
    </a>
  </div>

  <!-- Filtro rápido JS -->
  <div class="d-flex gap-2 mb-3 flex-wrap">
    <button class="btn btn-sm btn-outline-secondary active" onclick="filtrar('TODOS', this)">Todos</button>
    <button class="btn btn-sm btn-outline-danger"  onclick="filtrar('MASCOTA_PERDIDA', this)">
      <i class="bi bi-exclamation-circle me-1"></i> Perdidos
    </button>
    <button class="btn btn-sm btn-outline-success" onclick="filtrar('TENGO_CONMIGO', this)">
      <i class="bi bi-check-circle me-1"></i> Encontrados
    </button>
    <button class="btn btn-sm btn-outline-warning"  onclick="filtrar('SOLO_LO_VI', this)">
      <i class="bi bi-eye me-1"></i> Solo lo vi
    </button>
  </div>

  <div class="card shadow-sm">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0" id="reportesTable">
          <thead class="table-light">
            <tr>
              <th>Foto</th>
              <th>Descripción</th>
              <th>Tipo</th>
              <th>Zona</th>
              <th>Fecha</th>
              <th>Reportado por</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="r : ${listReportes}" th:attr="data-tipo=${r.tipoReporte}">
              <td>
                <img th:if="${r.foto != null}"
                     th:src="@{/assets/img/{f}(f=${r.foto})}"
                     class="pet-thumb" alt="foto"
                     onerror="this.style.display='none'">
                <i th:unless="${r.foto != null}" class="bi bi-image text-muted"></i>
              </td>
              <td style="max-width:250px;" class="small" th:text="${r.descripcion}">—</td>
              <td>
                <span class="tipo-pill"
                      th:classappend="${r.tipoReporte?.name() == 'MASCOTA_PERDIDA'} ? 'bg-danger text-white' :
                                      (${r.tipoReporte?.name() == 'TENGO_CONMIGO'} ? 'bg-success text-white' : 'bg-warning text-dark')"
                      th:text="${r.tipoReporte}">—</span>
              </td>
              <td class="small" th:text="${r.ubicacion}">—</td>
              <td class="small text-muted" th:text="${r.fecha != null ? #temporals.format(r.fecha, 'dd/MM/yyyy') : '—'}">—</td>
              <td class="small" th:text="${r.usuario != null ? r.usuario.nombre + ' ' + r.usuario.apellido : 'Anónimo'}">—</td>
              <td>
                <a th:href="@{/petsit/admin/reportes/delete/{id}(id=${r.id})}"
                   class="btn btn-sm btn-outline-danger"
                   onclick="return confirm('¿Eliminar este reporte?')">
                  <i class="bi bi-trash"></i>
                </a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  function filtrar(tipo, btn) {
    document.querySelectorAll('.btn-outline-secondary,.btn-outline-danger,.btn-outline-success,.btn-outline-warning')
      .forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('#reportesTable tbody tr').forEach(tr => {
      tr.style.display = (tipo === 'TODOS' || tr.dataset.tipo === tipo) ? '' : 'none';
    });
  }
</script>
</body>
</html>
