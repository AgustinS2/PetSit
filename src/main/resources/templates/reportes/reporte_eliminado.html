<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>PetSit</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Caudex:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" th:href="@{/css/core.css}">
  <link rel="icon" th:href="@{/assets/favicon/favicon.ico}" sizes="any">
  <style>body{font-family:'Caudex',serif;}</style>
</head>
<body class="petsit-bg d-flex align-items-center justify-content-center" style="min-height:100vh;">
<div class="text-center p-4" style="max-width:460px;width:100%;">
  <div style="width:80px;height:80px;background:#6b728020;border-radius:24px;display:flex;align-items:center;justify-content:center;margin:0 auto 1.5rem;">
    <i class="bi bi-trash-fill" style="font-size:2.2rem;color:#6b7280;"></i>
  </div>
  <h2 class="fw-700 mb-2">Reporte eliminado</h2>
  <p class="text-muted mb-4">El reporte fue eliminado. Ya no aparece en el mapa.</p>
  <div class="d-flex gap-2 justify-content-center flex-wrap">
    <a th:href="@{/petsit/reportes/mis_reportes}" class="btn btn-primary px-4 fw-bold">Mis reportes</a>
    <a th:href="@{/petsit/usuarios/usuariomapa}" class="btn btn-outline-secondary px-4">Ver mapa</a>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
